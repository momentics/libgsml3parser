name: Build Release Package

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Static Build
        run: >
          cmake -B build_static -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTS=ON
          -DBUILD_EXAMPLES=OFF

      - name: Build Static Library
        run: cmake --build build_static --config Release --parallel

      - name: Run Tests
        run: ctest --test-dir build_static --output-on-failure --parallel

      - name: Install Static Library
        run: cmake --install build_static

      - name: Configure Shared Build
        run: >
          cmake -B build_shared -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTS=OFF
          -DBUILD_EXAMPLES=OFF

      - name: Build Shared Library
        run: cmake --build build_shared --config Release --parallel

      - name: Install Shared Library
        run: cmake --install build_shared

      - name: Create Archive
        run: |
          PKG="gsml3parser-${{ github.ref_name }}-linux-x86_64"
          tar czf "${PKG}.tar.gz" -C install .

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gsml3parser-${{ github.ref_name }}-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
