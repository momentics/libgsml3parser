name: Build Release Package

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Release packaging: runs after all CI checks pass.
    needs: [linux-tsan, linux-fuzz]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Static library install ──────────────────────────────────────

      - name: Configure Static Build (lib only)
        run: >
          cmake -B build_static_lib -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install_static
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_EXAMPLES=OFF

      - name: Build Static Library
        run: cmake --build build_static_lib --config Release --parallel 2

      - name: Install Static Library
        run: cmake --install build_static_lib

      # ── Shared library install ──────────────────────────────────────

      - name: Configure Shared Build
        run: >
          cmake -B build_shared -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_INSTALL_PREFIX=install_shared
          -DBUILD_SHARED_LIBS=ON
          -DBUILD_TESTS=OFF
          -DBUILD_EXAMPLES=OFF

      - name: Build Shared Library
        run: cmake --build build_shared --config Release --parallel 2

      - name: Install Shared Library
        run: cmake --install build_shared

      # ── Tests (linked against static lib) ──────────────────────────

      - name: Configure Static Build (tests)
        run: >
          cmake -B build_static_tests -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTS=ON
          -DBUILD_EXAMPLES=OFF

      - name: Build Tests
        run: cmake --build build_static_tests --config Release --parallel 1

      - name: Run Tests
        run: ctest --test-dir build_static_tests --output-on-failure --parallel 2

      # ── Examples (linked against static lib) ───────────────────────

      - name: Configure Static Build (examples)
        run: >
          cmake -B build_static_examples -DCMAKE_BUILD_TYPE=Release
          -DBUILD_SHARED_LIBS=OFF
          -DBUILD_TESTS=OFF
          -DBUILD_EXAMPLES=ON

      - name: Build Examples
        run: cmake --build build_static_examples --config Release --parallel 1

      # ── Assemble release package ───────────────────────────────────

      - name: Create Archive
        run: |
          PKG="gsml3parser-${{ github.ref_name }}-linux-x86_64"
          mkdir -p "$PKG/include" "$PKG/lib" "$PKG/doc" "$PKG/bin/tests" "$PKG/bin/examples"

          # Headers
          cp -r install_static/include/gsml3parser "$PKG/include/"

          # CMake config files
          cp -r install_static/lib/cmake "$PKG/lib/" 2>/dev/null || true

          # COPYING license
          cp install_static/share/licenses/gsml3parser/COPYING "$PKG/" 2>/dev/null || true

          # Static library (.a)
          cp install_static/lib/libgsml3parser.a "$PKG/lib/"

          # Shared library (.so + symlink)
          cp -P install_shared/lib/libgsml3parser.so* "$PKG/lib/"

          # API documentation
          cp doc/API.md "$PKG/doc/"

          # Test binaries
          cp build_static_tests/tests/gsml3parser_tests "$PKG/bin/tests/"

          # Example binaries
          for exe in build_static_examples/examples/example_*; do
            [ -f "$exe" ] && cp "$exe" "$PKG/bin/examples/"
          done

          tar czf "${PKG}.tar.gz" "$PKG"

      - name: Publish Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gsml3parser-${{ github.ref_name }}-linux-x86_64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── CI: Linux/Clang ThreadSanitizer (sharded-registry concurrency) ──

  linux-tsan:
    name: Linux (Clang) ThreadSanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Configure
        run: >
          cmake -S . -B build_tsan -DBUILD_TESTS=ON -DBUILD_EXAMPLES=OFF
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: cmake --build build_tsan --parallel
      - name: Concurrency tests (TSan)
        run: >
          ./build_tsan/tests/gsml3parser_tests
          --gtest_filter=*Thread*:*Shard*:*Concurrent*:*TornRead*
        env:
          TSAN_OPTIONS: suppressions=

  # ── CI: Linux/Clang fuzzing smoke (libFuzzer) ───────────────────────
  # Separate job: the fuzzer sanitizer is incompatible with
  # ThreadSanitizer.

  linux-fuzz:
    name: Linux (Clang) fuzzing smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Configure
        run: >
          cmake -S . -B build_fuzz -DBUILD_TESTS=OFF -DBUILD_EXAMPLES=OFF
          -DENABLE_FUZZING=ON
          -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build_fuzz --parallel
      - name: Fuzz smoke (2000 runs per target)
        run: >
          ctest --test-dir build_fuzz -C Release --output-on-failure
          -R "_smoke$"
