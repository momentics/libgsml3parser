# CI gate for the FFI bindings (bindings/): builds the shared core and runs the
# Python / Go / Rust tests + examples on both supported platforms via the single
# unified script scripts/verify_bindings.ps1. Independent from build-release.yml.
name: FFI Bindings

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bindings:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # cgo needs a C compiler. On Linux pin clang (matches the repo's existing
      # sanitizer CI toolchain). Go builds cgo on windows/amd64 with its GNU
      # toolchain flavor only, and `go test -race` additionally links the
      # ThreadSanitizer runtime — so Windows gets a full MinGW-w64 GCC: MSYS2 is
      # preinstalled on the runner (bare) and pacman installs the toolchain into
      # it. The unified gate detects and smoke-tests every candidate itself.
      - name: Install C toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld
      - name: Install MinGW-w64 GCC via MSYS2 (Windows, for Go cgo and -race)
        if: runner.os == 'Windows'
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Syy --noconfirm --needed mingw-w64-x86_64-gcc"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest (test-only dependency)
        run: python -m pip install pytest

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy   # the gate runs `cargo clippy -- -D warnings`

      - name: Run the unified bindings gate (repo invariants + core shared lib + 3 languages)
        # No -Generator: CMake auto-selects what this runner carries. On Linux
        # cgo gets CC=clang from inside the script (matches build-release.yml,
        # which installs clang for the sanitizer job).
        run: pwsh scripts/verify_bindings.ps1 -Config Release
