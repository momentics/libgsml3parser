[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "gsml3parser"
# The product version has exactly ONE home: the repository-root VERSION file.
# At sdist/wheel build time setuptools reads it into [project] (build-time
# propagation, nothing hardcoded here). At RUNTIME the package version is the
# C core's own report (gsml3_version(), baked by CMake from that same file):
# gsml3parser.__version__ == gsml3parser.version(). No file I/O in the
# installed package.
dynamic = ["version"]
description = "ctypes bindings over the libgsml3parser C ABI (GSM L3, A-bis RSL, LAPDm, BTS stack)"
readme = "../README.md"
# >=3.10: public signatures use PEP 604 unions (`int | None`), evaluated at runtime.
requires-python = ">=3.10"
# Runtime: standard library only (ctypes). No third-party dependencies.

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.dynamic]
# Read by setuptools at build time only; relative to this pyproject.toml,
# bindings/python/../../VERSION is the repository-root single source of truth.
version = { file = ["../../VERSION"] }

[tool.setuptools]
packages = ["gsml3parser"]

[tool.pytest.ini_options]
# The Phase-1 test functions keep their descriptive step-1.7 names (e.g.
# stack_mo_call_simulation) alongside the test_*-prefixed ones; collect this
# explicit family set under this directory tree (module helpers stay private).
python_functions = [
    "test_*", "parse_*", "roundtrip_*", "error_paths", "null_safety_*",
    "config_setters", "stack_*", "registry_*", "session_*",
    "t200_retransmission", "frames_received_counting", "lapdm_decode_wrapper_validation",
]
