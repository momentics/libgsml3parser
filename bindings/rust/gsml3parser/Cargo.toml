[package]
name = "gsml3parser"
# Keep in sync with the repo-root VERSION file (decision #13); the gate's
# manifest version check fails on drift. Currently 0.19.0.
version = "0.19.0"
edition = "2021"
rust-version = "1.75"
description = "Safe Rust wrapper over the libgsml3parser C ABI (GSM L3 / RSL / LAPDm / BTS stack)"
license = "MIT"

[dependencies]
gsml3parser-sys = { path = "../gsml3parser-sys" }
# No other dependencies: std only. (dev-deps intentionally empty.)

[[example]]
name = "bts_simulation"
