[package]
name = "gsml3parser"
# Must stay in sync with the repo-root VERSION file (single source of truth
# for the product version; Cargo cannot read a version from a file). The
# unified gate's manifest version check fails on drift.
version = "1.0.0"
edition = "2021"
rust-version = "1.75"
description = "Safe Rust wrapper over the libgsml3parser C ABI (GSM L3 / RSL / LAPDm / BTS stack)"
license = "MIT"

[dependencies]
gsml3parser-sys = { path = "../gsml3parser-sys" }
# No other dependencies: std only. (dev-deps intentionally empty.)

[[example]]
name = "bts_simulation"
