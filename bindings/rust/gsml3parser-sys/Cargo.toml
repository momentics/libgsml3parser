[package]
name = "gsml3parser-sys"
# Product version: this literal must equal the repo-root VERSION file, the
# single source of truth for the release version (Cargo cannot read a version
# from a file). The unified gate fails on drift between the two.
version = "0.19.0"
edition = "2021"
rust-version = "1.75"
description = "Raw FFI declarations for the libgsml3parser C ABI (no dependencies)"
license = "MIT"

[lib]
crate-type = ["rlib"]   # consumed only by gsml3parser (the safe wrapper)

[build-dependencies]
# None. Link resolution is plain path search + cargo: directives — zero deps.
