[package]
name = "gsml3parser-sys"
# Product version: literal that must equal the repo-root VERSION file (single
# source of truth, planK decision #13 — Cargo cannot read it from a file). The
# unified gate fails the build on drift. Currently 0.19.0.
version = "0.19.0"
edition = "2021"
rust-version = "1.75"
description = "Raw FFI declarations for the libgsml3parser C ABI (no dependencies)"
license = "MIT"

[lib]
crate-type = ["rlib"]   # consumed only by gsml3parser (the safe wrapper)

[build-dependencies]
# None. Link resolution is plain path search + cargo: directives — zero deps.
